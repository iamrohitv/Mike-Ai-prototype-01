[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mike"
version = "0.1.0"
description = "Mike - Rohit's proprietary personal AI counterpart"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
]

[project.scripts]
mike = "interfaces.text.cli:main"
mike-desktop = "interfaces.desktop.app:main"
mike-remote = "interfaces.remote.server:main"

[tool.setuptools]
packages = [
    "core",
    "core.identity",
    "core.mood",
    "core.tone",
    "core.context",
    "core.reasoning",
    "core.planning",
    "memory",
    "policies",
    "awareness",
    "guardian",
    "operations",
    "perception",
    "tools",
    "tools.computer",
    "interfaces",
    "interfaces.text",
    "interfaces.desktop",
    "interfaces.remote",
    "awareness",
    "security",
    "monitoring",
    "events",
]