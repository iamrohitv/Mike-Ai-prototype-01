<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#020409">
<title>MIKE · remote</title>
<link rel="manifest" id="manifest">
<style>
:root{
  --bg:#020409; --panel:#0b1120; --edge:#1a2542; --cyan:#00e5ff;
  --violet:#7c4dff; --pink:#ff2e88; --text:#e6ecff; --dim:#8b93b8;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:radial-gradient(1200px 800px at 50% -10%, #0a1430 0%, var(--bg) 55%);
  color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; max-width:520px; margin:0 auto;
  padding:14px; height:100dvh;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 4px 14px;
}
.brand{display:flex; align-items:center; gap:10px;}
.orb{
  width:26px; height:26px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #7ff7ff, var(--cyan) 45%, #0b7f8a);
  box-shadow:0 0 18px rgba(0,229,255,.8); animation:pulse 2s infinite;
}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(0,229,255,1);}}
h1{font-size:18px; letter-spacing:4px; font-weight:700;}
#conn{font-size:11px; color:var(--dim);}
#conn.ok{color:var(--cyan);} #conn.bad{color:var(--pink);}
#chat{
  flex:1; overflow-y:auto; padding:6px 2px;
  display:flex; flex-direction:column; gap:10px;
}
.msg{max-width:88%; padding:9px 12px; border-radius:12px; font-size:14px; line-height:1.45;}
.msg.user{align-self:flex-end; background:#0e2a3a; border:1px solid var(--edge);
  border-bottom-right-radius:2px; color:var(--cyan);}
.msg.mike{align-self:flex-start; background:var(--panel); border:1px solid var(--edge);
  border-bottom-left-radius:2px; color:var(--violet);}
.msg.state{align-self:center; color:var(--dim); font-size:11px; font-style:italic; background:none;}
.chips{display:flex; gap:8px; flex-wrap:wrap; padding:10px 0;}
.chip{
  background:var(--panel); color:var(--cyan); border:1px solid var(--edge);
  border-radius:999px; padding:7px 14px; font-size:12px; font-weight:600;
  cursor:pointer; letter-spacing:1px;
}
.chip:active{background:var(--cyan); color:var(--bg);}
#inputrow{display:flex; gap:8px; align-items:center;}
#text{
  flex:1; background:var(--panel); border:1px solid var(--edge); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:15px; outline:none;
}
#text:focus{border-color:var(--cyan);}
button{border:none; cursor:pointer;}
#send{
  background:var(--cyan); color:var(--bg); border-radius:12px;
  padding:12px 18px; font-size:15px; font-weight:700;
}
#mic{
  width:56px; height:56px; border-radius:50%; margin:0 auto;
  background:var(--panel); border:2px solid var(--cyan); color:var(--cyan);
  font-size:22px; display:flex; align-items:center; justify-content:center;
}
#mic.active{background:var(--pink); border-color:var(--pink); color:#fff;
  animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.55;}}
#microw{display:flex; padding:10px 0 4px;}
#keyrow{display:flex; gap:8px; padding-bottom:10px;}
#key{
  flex:1; background:var(--panel); border:1px solid var(--edge); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:14px; outline:none;
}
#lock{
  background:var(--violet); color:#fff; border-radius:12px; padding:12px 16px;
  font-weight:700; font-size:14px;
}
.hidden{display:none !important;}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="orb"></div><h1>MIKE</h1></div>
  <div id="conn">connecting…</div>
</header>
<div id="chat"></div>
<div class="chips" id="chips">
  <div class="chip" data-cmd="brief me">BRIEFING</div>
  <div class="chip" data-cmd="system status">STATUS</div>
  <div class="chip" data-cmd="list my tasks">TASKS</div>
  <div class="chip" data-cmd="compact memory">COMPACT</div>
</div>
<div id="keyrow" class="hidden">
  <input id="key" type="password" placeholder="remote key" autocomplete="off">
  <button id="lock">CONNECT</button>
</div>
<div id="inputrow">
  <input id="text" type="text" placeholder="type a command…" autocomplete="off">
  <button id="send">SEND</button>
</div>
<div id="microw"><button id="mic">🎙</button></div>

<script>
const chat=document.getElementById('chat');
const conn=document.getElementById('conn');
const textEl=document.getElementById('text');
const sendBtn=document.getElementById('send');
const micBtn=document.getElementById('mic');
const chips=document.getElementById('chips');
const keyrow=document.getElementById('keyrow');
const keyEl=document.getElementById('key');
const lockBtn=document.getElementById('lock');

let key=localStorage.getItem('mike_key')||'';
let base=location.origin;
let recognizing=false;
let rec=null;

function say(text){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=1.0; u.pitch=1.0;
    const voices=speechSynthesis.getVoices();
    if(voices.length) u.voice=voices.find(v=>/female|zira|google/i.test(v.name))||voices[0];
    speechSynthesis.speak(u);
  }
}
function addMsg(kind,text){
  const d=document.createElement('div');
  d.className='msg '+kind; d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function addState(text){ addMsg('state',text); }

async function api(path,body){
  const opts={headers:{'Authorization':'Bearer '+key}};
  if(body){opts.method='POST'; opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body);}
  const res=await fetch(base+path,opts);
  if(res.status===401){ conn.className='bad'; conn.textContent='unauthorized'; unlockKey(); throw new Error('unauthorized'); }
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

async function ping(){
  try{
    const r=await fetch(base+'/api/health'); const j=await r.json();
    conn.className='ok'; conn.textContent='online · '+ (j.brain?'brain on':'brain off');
    return true;
  }catch(e){ conn.className='bad'; conn.textContent='offline'; return false; }
}

function unlockKey(){
  keyrow.classList.remove('hidden');
  keyEl.value=key; keyEl.focus();
}
lockBtn.onclick=()=>{
  key=keyEl.value.trim(); localStorage.setItem('mike_key',key);
  keyrow.classList.add('hidden'); ping(); addState('key saved');
};

async function sendCmd(text){
  text=text.trim(); if(!text) return;
  if(!key){ unlockKey(); return; }
  addMsg('user',text);
  textEl.value='';
  addState('thinking…');
  try{
    const j=await api('/api/chat',{message:text});
    addMsg('mike',j.reply);
    say(j.reply);
  }catch(e){
    addMsg('state',e.message);
  }
}

sendBtn.onclick=()=>sendCmd(textEl.value);
textEl.addEventListener('keydown',e=>{ if(e.key==='Enter') sendCmd(textEl.value); });
chips.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip) sendCmd(chip.dataset.cmd);
});

if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR(); rec.lang='en-IN'; rec.interimResults=false; rec.maxAlternatives=1;
  micBtn.onclick=()=>{
    if(recognizing){ rec.stop(); return; }
    if(!key){ unlockKey(); return; }
    try{
      rec.start(); recognizing=true; micBtn.classList.add('active');
      addState('listening…');
    }catch(e){ recognizing=false; }
  };
  rec.onresult=(ev)=>{
    const text=ev.results[0][0].transcript;
    sendCmd(text);
  };
  rec.onend=()=>{ recognizing=false; micBtn.classList.remove('active'); };
  rec.onerror=(ev)=>{ recognizing=false; micBtn.classList.remove('active');
    addState('mic: '+(ev.error||'error')); };
}else{
  micBtn.style.opacity=.3; micBtn.title='speech not supported in this browser';
}

if('serviceWorker' in navigator){}
(async()=>{ await ping(); })();
</script>
</body>
</html>
